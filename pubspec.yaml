name: face_recognition_sdk
description: FacePlugin Face Recognition SDK for Flutter.
version: 0.1.0
homepage: https://faceplugin.com
repository: https://github.com/Faceplugin-ltd/FaceRecognition-Flutter

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.1.8
  camera: ^0.12.0
  image: ^4.3.0
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.faceplugin.face_recognition_sdk
        pluginClass: FaceRecognitionSdkPlugin
      ios:
        pluginClass: FaceRecognitionSdkPlugin
